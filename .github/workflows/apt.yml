name: Publish Linux package repositories
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: linux-package-repositories
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Resolve release channel package versions
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*)
              if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                channel=stable
                package_version="${BASH_REMATCH[1]}"
                arch_version="$package_version"
              elif [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta\.([1-9][0-9]*)$ ]]; then
                channel=beta
                package_version="${BASH_REMATCH[1]}~beta.${BASH_REMATCH[2]}"
                arch_version="${BASH_REMATCH[1]}.beta.${BASH_REMATCH[2]}"
              elif [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-nightly\.([0-9]{8})$ ]]; then
                channel=nightly
                package_version="${BASH_REMATCH[1]}~nightly.${BASH_REMATCH[2]}"
                arch_version="${BASH_REMATCH[1]}.nightly.${BASH_REMATCH[2]}"
              else
                echo "::error::unsupported package release tag: ${RELEASE_TAG}"
                exit 1
              fi
              ;;
            *)
              echo "::error::unsupported package release tag: ${RELEASE_TAG}"
              exit 1
              ;;
          esac
          echo "PACKAGE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "ARCH_VERSION=$arch_version" >> "$GITHUB_ENV"
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c dpkg-dev rpm
      - name: Download and build Arch package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arch-build" "$RUNNER_TEMP/arch-source"
          archive_name="ash-${RELEASE_TAG}-linux-amd64.tar.gz"
          gh release download "$RELEASE_TAG" --pattern "$archive_name" --dir "$RUNNER_TEMP/arch-source"
          archive="$RUNNER_TEMP/arch-source/${archive_name}"
          test -s "$archive"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          cp scripts/package/arch/PKGBUILD "$RUNNER_TEMP/arch-build/PKGBUILD"
          cp "$archive" "$RUNNER_TEMP/arch-build/ash.tar.gz"
          docker run --rm --platform linux/amd64 \
            -e "ASH_VERSION=${ARCH_VERSION}" \
            -e "ASH_ARCHIVE_SHA256=${archive_sha256}" \
            -v "$RUNNER_TEMP/arch-build:/build" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm
              useradd --create-home builder
              chown -R builder:builder /build
              runuser -u builder -- env \
                "ASH_VERSION=$ASH_VERSION" \
                "ASH_ARCHIVE_SHA256=$ASH_ARCHIVE_SHA256" \
                bash -euo pipefail -c "cd /build && makepkg --noconfirm --clean"
              package="/build/ash-${ASH_VERSION}-1-x86_64.pkg.tar.zst"
              test -s "$package"
              bsdtar -xOf "$package" .PKGINFO | grep -Fx "pkgname = ash"
              bsdtar -xOf "$package" .PKGINFO | grep -Fx "pkgver = ${ASH_VERSION}-1"
              bsdtar -xOf "$package" .PKGINFO | grep -Fx "arch = x86_64"
            '
      - name: Download and validate release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs" "$RUNNER_TEMP/rpms"
          gh release download "$RELEASE_TAG" --pattern '*.deb' --dir "$RUNNER_TEMP/debs"
          gh release download "$RELEASE_TAG" --pattern '*.rpm' --dir "$RUNNER_TEMP/rpms"
          packages=("$RUNNER_TEMP"/debs/*.deb)
          if [[ ${#packages[@]} -ne 2 ]]; then
            echo "::error::expected amd64 and arm64 .deb packages for ${RELEASE_TAG}, found ${#packages[@]}"
            exit 1
          fi
          amd64_found=0
          arm64_found=0
          for package in "${packages[@]}"; do
            package_name="$(dpkg-deb --field "$package" Package)"
            architecture="$(dpkg-deb --field "$package" Architecture)"
            package_version="$(dpkg-deb --field "$package" Version)"
            if [[ "$package_name" != ash || "$package_version" != "$PACKAGE_VERSION" ]]; then
              echo "::error::unexpected package metadata in $(basename "$package")"
              exit 1
            fi
            case "$architecture" in
              amd64)
                if [[ "$amd64_found" -eq 1 ]]; then
                  echo "::error::duplicate amd64 .deb package"
                  exit 1
                fi
                amd64_found=1
                ;;
              arm64)
                if [[ "$arm64_found" -eq 1 ]]; then
                  echo "::error::duplicate arm64 .deb package"
                  exit 1
                fi
                arm64_found=1
                ;;
              *)
                echo "::error::unsupported Debian package architecture: ${architecture}"
                exit 1
                ;;
            esac
          done
          if [[ "$amd64_found" -ne 1 || "$arm64_found" -ne 1 ]]; then
            echo "::error::release must include one amd64 and one arm64 .deb package"
            exit 1
          fi

          packages=("$RUNNER_TEMP"/rpms/*.rpm)
          if [[ ${#packages[@]} -ne 2 ]]; then
            echo "::error::expected x86_64 and aarch64 RPM packages for ${RELEASE_TAG}, found ${#packages[@]}"
            exit 1
          fi
          x86_64_found=0
          aarch64_found=0
          for package in "${packages[@]}"; do
            package_metadata="$(rpm -qp --queryformat '%{NAME}|%{VERSION}|%{ARCH}' "$package")"
            IFS='|' read -r package_name package_version architecture <<< "$package_metadata"
            if [[ "$package_name" != ash || "$package_version" != "$PACKAGE_VERSION" ]]; then
              echo "::error::unexpected RPM metadata in $(basename "$package")"
              exit 1
            fi
            case "$architecture" in
              x86_64)
                if [[ "$x86_64_found" -eq 1 ]]; then
                  echo "::error::duplicate x86_64 RPM package"
                  exit 1
                fi
                x86_64_found=1
                ;;
              aarch64)
                if [[ "$aarch64_found" -eq 1 ]]; then
                  echo "::error::duplicate aarch64 RPM package"
                  exit 1
                fi
                aarch64_found=1
                ;;
              *)
                echo "::error::unsupported RPM architecture: ${architecture}"
                exit 1
                ;;
            esac
          done
          if [[ "$x86_64_found" -ne 1 || "$aarch64_found" -ne 1 ]]; then
            echo "::error::release must include one x86_64 and one aarch64 RPM package"
            exit 1
          fi
      - name: Import signing key and update repositories
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::configure the GPG_PRIVATE_KEY repository secret with the base64-encoded exported secret key"
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ -z "$key_id" ]]; then
            echo "::error::GPG_PRIVATE_KEY did not import a signing key"
            exit 1
          fi

          if [[ "$PACKAGE_CHANNEL" == stable ]]; then
            rpm_repo=site/rpm
            pacman_repo=site/pacman/x86_64
          else
            rpm_repo="site/rpm/${PACKAGE_CHANNEL}"
            pacman_repo="site/pacman/${PACKAGE_CHANNEL}/x86_64"
          fi
          mkdir -p "site/apt/pool/${PACKAGE_CHANNEL}/main" \
            "site/apt/dists/${PACKAGE_CHANNEL}/main/binary-amd64" \
            "site/apt/dists/${PACKAGE_CHANNEL}/main/binary-arm64" \
            "$rpm_repo/packages" \
            "$pacman_repo"
          install -m 0644 "$RUNNER_TEMP"/debs/*.deb "site/apt/pool/${PACKAGE_CHANNEL}/main/"
          install -m 0644 "$RUNNER_TEMP"/rpms/*.rpm "$rpm_repo/packages/"
          find "$pacman_repo" -maxdepth 1 -type f -name '*.pkg.tar.zst*' -delete
          rm -f "$pacman_repo"/versionx.db*
          install -m 0644 "$RUNNER_TEMP"/arch-build/*.pkg.tar.zst "$pacman_repo/"
          gpg --batch --armor --export "$key_id" > site/apt/gpg.key
          gpg --batch --armor --export "$key_id" > site/rpm/gpg.key
          gpg --batch --armor --export "$key_id" > site/pacman/gpg.key

          (
            cd site/apt
            for architecture in amd64 arm64; do
              apt_directory="dists/${PACKAGE_CHANNEL}/main/binary-${architecture}"
              dpkg-scanpackages --arch "$architecture" "pool/${PACKAGE_CHANNEL}/main" /dev/null > "${apt_directory}/Packages"
              gzip -9n -c "${apt_directory}/Packages" > "${apt_directory}/Packages.gz"
            done

            rm -f "dists/${PACKAGE_CHANNEL}/Release" "dists/${PACKAGE_CHANNEL}/InRelease" "dists/${PACKAGE_CHANNEL}/Release.gpg"
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="VersionX" \
              -o APT::FTPArchive::Release::Label="VersionX APT Repository" \
              -o APT::FTPArchive::Release::Suite="${PACKAGE_CHANNEL}" \
              -o APT::FTPArchive::Release::Codename="${PACKAGE_CHANNEL}" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="Official APT repository for ash" \
              release "dists/${PACKAGE_CHANNEL}" > "dists/${PACKAGE_CHANNEL}/Release"
            gpg --batch --yes --local-user "$key_id" --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --clearsign \
              --output "dists/${PACKAGE_CHANNEL}/InRelease" "dists/${PACKAGE_CHANNEL}/Release"
            gpg --batch --yes --local-user "$key_id" --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --armor --detach-sign \
              --output "dists/${PACKAGE_CHANNEL}/Release.gpg" "dists/${PACKAGE_CHANNEL}/Release"
            gpg --verify "dists/${PACKAGE_CHANNEL}/InRelease"
            gpg --verify "dists/${PACKAGE_CHANNEL}/Release.gpg" "dists/${PACKAGE_CHANNEL}/Release"
          )
          createrepo_c --checksum sha256 "$rpm_repo"
          gpg --batch --yes --local-user "$key_id" --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --armor --detach-sign \
            --output "$rpm_repo/repodata/repomd.xml.asc" "$rpm_repo/repodata/repomd.xml"
          gpg --verify "$rpm_repo/repodata/repomd.xml.asc" "$rpm_repo/repodata/repomd.xml"
          pacman_package="$(find "$pacman_repo" -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          if [[ -z "$pacman_package" ]]; then
            echo "::error::Arch package was not built"
            exit 1
          fi
          gpg --batch --yes --local-user "$key_id" --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --detach-sign \
            --output "${pacman_package}.sig" "$pacman_package"
          docker run --rm --platform linux/amd64 \
            -v "$PWD/$pacman_repo:/repo" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm
              cd /repo
              repo-add versionx.db.tar.gz *.pkg.tar.zst
              rm -f versionx.db
              cp versionx.db.tar.gz versionx.db
              rm -f versionx.files versionx.files.tar.gz
            '
          gpg --batch --yes --local-user "$key_id" --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --detach-sign \
            --output "$pacman_repo/versionx.db.sig" "$pacman_repo/versionx.db"
          gpg --verify "${pacman_package}.sig" "$pacman_package"
          gpg --verify "$pacman_repo/versionx.db.sig" "$pacman_repo/versionx.db"
      - name: Commit and push package repositories
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/apt site/rpm site/pacman
          if git diff --cached --quiet; then
            echo "APT repository is already up to date"
            exit 0
          fi
          git commit -m "chore(repositories): publish ash ${RELEASE_TAG}"
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
