name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  actions: read
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
      - name: Set up Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Setup Go
        uses: actions/setup-go@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          go-version-file: go.mod
      - name: Setup uv
        uses: astral-sh/setup-uv@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v10.0.1
        with:
          version: "0.12.5"
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.3
      - name: Run quality checks
        run: make verify
      - name: Verify external Go installs from the release tag
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          export GOBIN="$install_dir/bin"
          export GOPATH="$install_dir/go"
          export GOMODCACHE="$GOPATH/pkg/mod"
          mkdir -p "$GOBIN" "$GOMODCACHE"
          go install "github.com/Jonconradt/ash/cmd/ash@${GITHUB_REF_NAME}"
          go install "github.com/Jonconradt/ash/cmd/ash-broker@${GITHUB_REF_NAME}"
          "$GOBIN/ash" --help
          "$GOBIN/ash-broker" --version
      - name: Verify FreeBSD cross-compilation
        run: |
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=freebsd GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=freebsd GOARCH=amd64 go vet ./...
  package-macos:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
      - name: Set up Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Setup Go
        uses: actions/setup-go@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          go-version-file: go.mod
      - name: Build and package macOS artifacts
        run: |
          make release-artifacts RELEASE_TARGET_OSES=darwin RELEASE_TARGET_ARCHES=${{ matrix.arch }} RELEASE_VERSION="${GITHUB_REF_NAME}"
      - name: Smoke test native macOS arm64 tarball
        run: |
          set -euo pipefail
          archive="dist/release/ash-${GITHUB_REF_NAME}-darwin-arm64.tar.gz"
          mkdir -p smoke
          tar -xzf "$archive" -C smoke
          binary="smoke/ash-${GITHUB_REF_NAME}-darwin-arm64"
          "$binary" --help
          "$binary" version
          smoke_home="$(mktemp -d)"
          env -i HOME="$smoke_home" PATH="$PATH" "$PWD/$binary" install --shell bash --shell-integration </dev/null
          test -f "$smoke_home/.config/ash/.ash_bashrc"
          bash -n "$smoke_home/.config/ash/.ash_bashrc"
      - name: Install and smoke test macOS package
        run: |
          set -euo pipefail
          package="dist/release/ash-${GITHUB_REF_NAME}-darwin-${{ matrix.arch }}.pkg"
          sudo installer -pkg "$package" -target /
          /usr/local/bin/ash --help
          /usr/local/bin/ash-broker --version
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/*darwin-${{ matrix.arch }}*
  package-linux:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
      - name: Set up Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Setup Go
        uses: actions/setup-go@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document --version 1.18.0 fpm
      - name: Build and package Linux artifacts
        run: |
          make release-artifacts RELEASE_TARGET_OSES=linux RELEASE_TARGET_ARCHES=${{ matrix.arch }} RELEASE_VERSION="${GITHUB_REF_NAME}"
      - name: Smoke test native Linux amd64 tarball
        run: |
          set -euo pipefail
          archive="dist/release/ash-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          mkdir -p smoke
          tar -xzf "$archive" -C smoke
          binary="smoke/ash-${GITHUB_REF_NAME}-linux-amd64"
          "$binary" --help
          "$binary" version
          smoke_home="$(mktemp -d)"
          env -i HOME="$smoke_home" PATH="$PATH" "$PWD/$binary" install --shell bash --shell-integration </dev/null
          test -f "$smoke_home/.config/ash/.ash_bashrc"
          bash -n "$smoke_home/.config/ash/.ash_bashrc"
      - name: Install and smoke test Linux packages
        run: |
          set -euo pipefail
          deb="dist/release/ash-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.deb"
          rpm="dist/release/ash-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.rpm"
          sudo apt-get install -y "./$deb"
          /usr/bin/ash --help
          /usr/bin/ash-broker --version
          sudo apt-get remove -y ash
          sudo rpm -i "$rpm"
          /usr/bin/ash --help
          /usr/bin/ash-broker --version
          sudo rpm -e ash
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*linux-${{ matrix.arch }}*
  package-freebsd:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
      - name: Set up Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Setup Go
        uses: actions/setup-go@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          go-version-file: go.mod
      - name: Install Rust cross toolchain (FreeBSD)
        # cross-rs builds the Rust plugin inside a Docker image with a real FreeBSD
        # sysroot; a plain rustup target add can't link a FreeBSD binary from Linux.
        run: cargo install cross --version 0.2.5 --locked
      - name: Build and package FreeBSD artifacts
        run: |
          make release-artifacts RELEASE_TARGET_OSES=freebsd RELEASE_TARGET_ARCHES=${{ matrix.arch }} RELEASE_VERSION="${GITHUB_REF_NAME}"
      - name: Upload FreeBSD artifacts
        uses: actions/upload-artifact@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
        with:
          name: release-freebsd-${{ matrix.arch }}
          path: dist/release/*freebsd-${{ matrix.arch }}*
  smoke-freebsd:
    runs-on: ubuntu-latest
    needs: package-freebsd
    steps:
      - name: Download FreeBSD amd64 artifact
        uses: actions/download-artifact@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          name: release-freebsd-amd64
          path: artifacts
      - name: Install ash in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: "14"
          cache-after-prepare: true
          # FreeBSD ships no bash in base; prepare runs as root before the smoke script.
          prepare: |
            pkg install -y bash
          run: |
            set -eu
            command -v bash >/dev/null 2>&1 || { echo "bash missing from the VM"; exit 1; }
            bash --version | head -n 1
            archive=$(ls artifacts/ash-*-freebsd-amd64.tar.gz)
            tar -xzf "$archive" -C artifacts
            binary="${archive%.tar.gz}"
            chmod 0755 "$binary"
            "$binary" --help
            "$binary" install --shell bash --shell-integration --dry-run </dev/null
            "$binary" install --shell bash --shell-integration </dev/null
            test -f "$HOME/.config/ash/.ash_bashrc"
            bash -n "$HOME/.config/ash/.ash_bashrc"
            grep -q 'ash/\.ash_bashrc' "$HOME/.bashrc"
            grep -q '\$HOME/\.bashrc' "$HOME/.bash_profile"
            bash -lc 'true'
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs:
      - package-macos
      - package-linux
      - package-freebsd
    steps:
      - name: Checkout release tag
        uses: actions/checkout@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
        with:
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          path: dist/release
      - name: Flatten artifact directories
        run: |
          find dist/release -mindepth 2 -type f -name '*' -exec mv {} dist/release/ \;
      - name: Restore translation cache
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f7 # v4.2.4
        with:
          path: .site-translation-cache.json
          key: site-translation-cache-v1-${{ hashFiles('site/generate_locales.py') }}
          restore-keys: site-translation-cache-v1-
      - name: Generate translated website release artifact
        run: make release-translate RELEASE_VERSION="${GITHUB_REF_NAME}"
      - name: Add downloadable language catalogs
        run: |
          set -euo pipefail
          for catalog in internal/localize/languages/*.json; do
            locale="$(basename "$catalog" .json)"
            cp "$catalog" "dist/release/ash-language-${locale}.json"
          done
      - name: Generate release SBOM
        uses: anchore/sbom-action@88f49ff79e777bef6d3564531636ee4d3cc2f8d2 # v0.24.0
        with:
          path: dist/release
          format: spdx-json
          output-file: dist/release/sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.8.1
      - name: Generate and sign checksum manifest
        run: |
          set -euo pipefail
          cd dist/release
          : > SHA256SUMS
          for artifact in ash-*.pkg ash-*.deb ash-*.rpm ash-*.tar.gz ash-*.msi ash-language-*.json sbom.spdx.json; do
            if [[ -f "$artifact" ]]; then
              sha256sum "$artifact" >> SHA256SUMS
            fi
          done
          test -s SHA256SUMS
          cd ../..
          make release-checksums RELEASE_PACKAGE_DIR="$PWD/dist/release"
          cd dist/release
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Attest release artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/ash-*.pkg
            dist/release/ash-*.deb
            dist/release/ash-*.rpm
            dist/release/ash-*.tar.gz
            dist/release/ash-*.msi
            dist/release/ash-language-*.json
            dist/release/sbom.spdx.json
            dist/release/SHA256SUMS
      - name: Stage provenance bundle for release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/release/provenance.sigstore.json
      - name: Extract release notes
        run: |
          set -euo pipefail
          # actions/checkout writes a lightweight tag, so %(contents) would yield the commit message.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::${GITHUB_REF_NAME} is not an annotated tag; release notes are unavailable"
            exit 1
          fi
          git tag --list --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          test -s release-notes.md
          if ! grep -Eq '^[[:space:]]*## ([^[:alnum:][:space:]]+ )?Features[[:space:]]*$' release-notes.md ||
            ! grep -Eq '^[[:space:]]*## ([^[:alnum:][:space:]]+ )?Fixes & Improvements[[:space:]]*$' release-notes.md; then
            echo "::error::release notes for ${GITHUB_REF_NAME} are missing the required user-facing sections"
            cat release-notes.md
            exit 1
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/release/*
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: bash scripts/release/publish_homebrew_tap.sh "${GITHUB_REF_NAME}" dist/release/SHA256SUMS
