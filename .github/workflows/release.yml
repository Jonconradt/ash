name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  actions: read
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run quality checks
        run: make lint test
      - name: Ensure dist directory exists
        run: mkdir -p dist
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
  package-macos:
    runs-on: macos-14
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and package macOS artifacts
        run: |
          make release-artifacts RELEASE_TARGET_OSES=darwin RELEASE_TARGET_ARCHES=${{ matrix.arch }} RELEASE_VERSION="${GITHUB_REF_NAME}"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/*darwin-${{ matrix.arch }}*
  package-linux:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
      - name: Build and package Linux artifacts
        run: |
          make release-artifacts RELEASE_TARGET_OSES=linux RELEASE_TARGET_ARCHES=${{ matrix.arch }} RELEASE_VERSION="${GITHUB_REF_NAME}"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*linux-${{ matrix.arch }}*
  package-windows:
    if: false # Disabled until we want a working Windows build
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools wixl wixl-data
          command -v wixl
          command -v msiinfo
      - name: Build and package Windows artifacts
        run: |
          make release-artifacts RELEASE_TARGET_OSES=windows RELEASE_TARGET_ARCHES=${{ matrix.arch }} RELEASE_VERSION="${GITHUB_REF_NAME}"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*windows-${{ matrix.arch }}*
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    needs:
      - package-macos
      - package-linux
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/release
      - name: Flatten artifact directories
        run: |
          find dist/release -mindepth 2 -type f -name '*' -exec mv {} dist/release/ \;
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1
      - name: Generate and sign checksum manifest
        run: |
          set -euo pipefail
          cd dist/release
          : > SHA256SUMS
          for artifact in ash-*.pkg ash-*.deb ash-*.rpm ash-*.tar.gz ash-*.msi; do
            if [[ -f "$artifact" ]]; then
              sha256sum "$artifact" >> SHA256SUMS
            fi
          done
          test -s SHA256SUMS
          cd ../..
          make release-checksums RELEASE_PACKAGE_DIR="$PWD/dist/release"
          cd dist/release
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Extract release notes
        run: |
          set -euo pipefail
          # actions/checkout writes a lightweight tag, so %(contents) would yield the commit message.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::${GITHUB_REF_NAME} is not an annotated tag; release notes are unavailable"
            exit 1
          fi
          git tag --list --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          test -s release-notes.md
          if ! grep -Eq '^[[:space:]]*## ([^[:alnum:][:space:]]+ )?Features[[:space:]]*$' release-notes.md ||
            ! grep -Eq '^[[:space:]]*## ([^[:alnum:][:space:]]+ )?Fixes & Improvements[[:space:]]*$' release-notes.md; then
            echo "::error::release notes for ${GITHUB_REF_NAME} are missing the required user-facing sections"
            cat release-notes.md
            exit 1
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/release/*
