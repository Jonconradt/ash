name: nightly
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: nightly-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
    steps:
      - name: Validate release credentials
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_GITHUB_TOKEN" ]]; then
            echo "::error::configure the RELEASE_GITHUB_TOKEN repository secret before enabling nightly releases"
            exit 1
          fi
      - name: Checkout default branch and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      - name: Check for changes since the latest nightly
        id: changes
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --slurp |
            jq -r '[.[][] | select(.draft == false and (.tag_name | contains("-nightly.")))][0].tag_name // empty')"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$latest_tag" ]] && git diff --quiet "$latest_tag" HEAD -- . \
            ':(exclude)site/apt' ':(exclude)site/rpm' ':(exclude)site/pacman'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes since $latest_tag"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        if: steps.changes.outputs.publish == 'true'
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Install local validation tools
        if: steps.changes.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Set up Go
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Set up uv
        if: steps.changes.outputs.publish == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Set up Node.js
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.x
      - name: Configure release tag identity
        if: steps.changes.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Generate release notes from git history
        if: steps.changes.outputs.publish == 'true'
        env:
          LATEST_NIGHTLY_TAG: ${{ steps.changes.outputs.latest_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$LATEST_NIGHTLY_TAG" ]]; then
            log_range="$LATEST_NIGHTLY_TAG..HEAD"
          else
            log_range=HEAD
          fi
          notes_path="$RUNNER_TEMP/nightly-release-notes.md"
          git_summary="$(git log "$log_range" --no-merges --format='- %s' --max-count=10)"
          if [[ -z "$git_summary" ]]; then
            git_summary='- No non-merge commits were found.'
          fi
          {
            printf '%s\n\n' '## Features'
            printf '%s\n\n' '- This nightly includes the latest changes from the default branch.'
            printf '%s\n\n' '## Fixes & Improvements'
            printf '%s\n' "$git_summary"
          } > "$notes_path"
      - name: Publish nightly release
        if: steps.changes.outputs.publish == 'true'
        run: make release CHANNEL=nightly RELEASE_VERIFY_TARGET=verify-ci RELEASE_SKIP_LOCAL_ARTIFACTS=1 RELEASE_NOTES_INPUT="$RUNNER_TEMP/nightly-release-notes.md"
