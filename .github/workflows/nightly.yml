name: nightly
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: nightly-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      ASH_AI_ENDPOINT: ${{ secrets.ASH_AI_ENDPOINT }}
      ASH_AI_MODEL: ${{ secrets.ASH_AI_MODEL }}
      ASH_AI_AUTH_TOKEN: ${{ secrets.ASH_AI_AUTH_TOKEN }}
    steps:
      - name: Validate release credentials
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          ASH_AI_ENDPOINT: ${{ secrets.ASH_AI_ENDPOINT }}
          ASH_AI_MODEL: ${{ secrets.ASH_AI_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_GITHUB_TOKEN" ]]; then
            echo "::error::configure the RELEASE_GITHUB_TOKEN repository secret before enabling nightly releases"
            exit 1
          fi
          if [[ -z "$ASH_AI_ENDPOINT" || -z "$ASH_AI_MODEL" ]]; then
            echo "::error::configure the ASH_AI_ENDPOINT and ASH_AI_MODEL repository secrets before enabling nightly releases"
            exit 1
          fi
      - name: Checkout default branch and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      - name: Check for changes since the latest nightly
        id: changes
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --slurp |
            jq -r '[.[][] | select(.draft == false and (.tag_name | contains("-nightly.")))][0].tag_name // empty')"
          if [[ -n "$latest_tag" ]] && git diff --quiet "$latest_tag" HEAD -- . \
            ':(exclude)site/apt' ':(exclude)site/rpm' ':(exclude)site/pacman'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes since $latest_tag"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        if: steps.changes.outputs.publish == 'true'
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Set up Go
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Set up uv
        if: steps.changes.outputs.publish == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Set up Node.js
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.3
      - name: Restore translation cache
        if: steps.changes.outputs.publish == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/ash/site-translation-cache.json
          key: site-translation-cache-v2-${{ hashFiles('site/generate_locales.py') }}-${{ github.run_id }}
          restore-keys: site-translation-cache-v2-${{ hashFiles('site/generate_locales.py') }}-
      - name: Configure release tag identity
        if: steps.changes.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish nightly release
        if: steps.changes.outputs.publish == 'true'
        run: make release CHANNEL=nightly RELEASE_VERIFY_TARGET=verify-ci
